<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="GoldMind: live gold, silver and commodities signals with 19 strategies and AI analysis">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GoldMind">
  <title>GoldMind</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon-192.png" alt=""><span>Gold<b>Mind</b></span></div>
    <div class="spacer"></div>
    <div class="net"><i class="dot" id="net-dot"></i><span id="net-txt"></span></div>
    <a class="icon-btn" href="#settings" aria-label="settings" style="text-decoration:none">⚙️</a>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <a href="#home" data-tab="home"><span class="ic">⚡</span><span data-t="tabHome"></span></a>
    <a href="#today" data-tab="today"><span class="ic">🔮</span><span data-t="tabToday"></span></a>
    <a href="#analysis" data-tab="analysis"><span class="ic">📰</span><span data-t="tabAnalysis"></span></a>
    <a href="#strategies" data-tab="strategies"><span class="ic">🧠</span><span data-t="tabStrategies"></span></a>
  </nav>

  <div class="install" id="install">
    <span style="font-size:24px">📲</span>
    <b style="flex:1" data-t="install"></b>
    <button class="btn gold" id="install-go">OK</button>
    <button class="btn" id="install-x">✕</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
